
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<div style="display:flex; flex-direction:column; align-items:center; gap:20px; padding:2rem 0;">
  <div id="qr-container" style="padding:16px; background:#fff; border-radius:8px; border:0.5px solid var(--color-border-tertiary); display:inline-block;"></div>
  <p style="font-size:13px; color:var(--color-text-secondary); margin:0;">aitorino2009.github.io</p>
  <button id="dl-btn" style="font-size:14px; padding:8px 20px; cursor:pointer;">
    <i class="ti ti-download" aria-hidden="true" style="margin-right:6px;"></i>Descargar PNG
  </button>
</div>
<script>
  const qr = new QRCode(document.getElementById("qr-container"), {
    text: "https://aitorino2009.github.io",
    width: 180,
    height: 180,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("dl-btn").addEventListener("click", function() {
    setTimeout(function() {
      const canvas = document.querySelector("#qr-container canvas");
      if (!canvas) return;
      const finalCanvas = document.createElement("canvas");
      const pad = 24;
      finalCanvas.width = canvas.width + pad * 2;
      finalCanvas.height = canvas.height + pad * 2 + 36;
      const ctx = finalCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
      ctx.drawImage(canvas, pad, pad);
      ctx.fillStyle = "#000000";
      ctx.font = "13px monospace";
      ctx.textAlign = "center";
      ctx.fillText("Portfolio de proyectos", finalCanvas.width / 2, canvas.height + pad + 22);
      const link = document.createElement("a");
      link.download = "qr-portfolio-aitor.png";
      link.href = finalCanvas.toDataURL("image/png");
      link.click();
    }, 300);
  });
</script>
